# Manifest-mode workspace configuration.
#
# Sourced by .claude/skills/workspace-*/*.sh via lib/workspace.sh.
# All paths are relative to this file's directory unless absolute.

# Where each repo's main clone lives (per Pattern 1: the "root workspace"
# attaches repositories on their default branches here).
MAIN_CLONES_DIR="./.main"

# Parent of branch-based workspaces (per Pattern 3 / Pattern 4). Every
# worktree the skills create lives at <WORKTREE_ROOT>/<branch>/<repo>.
WORKTREE_ROOT="./worktrees"

# Repos to attach. Format per entry: "<name> <url> <default-branch>".
# <name> is also the directory name under MAIN_CLONES_DIR and inside each
# branch-based workspace.
REPOS=(
  "service-a https://github.com/example/service-a.git main"
  "service-b https://github.com/example/service-b.git main"
  "shared-lib https://github.com/example/shared-lib.git main"
)

# Optional: per-repo test commands consumed by workspace-test. The variable
# name is TEST_CMD_<repo> with non-alphanumerics replaced by '_'.
# A bare TEST_CMD is the fallback for repos without an override.
# Repos with no command configured are skipped (not failed) by workspace-test.
TEST_CMD_service_a="npm test"
TEST_CMD_service_b="make test"
# TEST_CMD="echo 'no tests configured'"
