# Manifest-mode workspace configuration.
#
# Sourced by .claude/skills/workspace-*/*.sh via lib/workspace.sh.
# All paths are relative to this file's directory unless absolute.

# Where each repo is cloned on its default branch.
MAIN_CLONES_DIR="./.main"

# Parent of per-branch worktree trees. Worktree paths become
# <WORKTREE_ROOT>/<branch>/<repo>.
WORKTREE_ROOT="./worktrees"

# Repos to attach. Format per entry: "<name> <url> <default-branch>".
# <name> is also the directory name under MAIN_CLONES_DIR and inside each
# per-branch worktree dir.
REPOS=(
  "service-a https://github.com/example/service-a.git main"
  "service-b https://github.com/example/service-b.git main"
  "shared-lib https://github.com/example/shared-lib.git main"
)
