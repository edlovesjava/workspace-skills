# Submodule-mode workspace configuration.
#
# Instead of listing repos inline, point at an "orchestration" repo whose
# .gitmodules describes the constituent repos. The skills clone the root
# under MAIN_CLONES_DIR/_root and read its .gitmodules to populate REPOS.

MAIN_CLONES_DIR="./.main"
WORKTREE_ROOT="./worktrees"

# The orchestration repo. Its .gitmodules drives the repo list.
ROOT_REPO="https://github.com/example/orchestration.git"

# REPOS is left empty; the skills derive it from the root's submodules.
REPOS=()
